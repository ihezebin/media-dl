services:
  media-dl:
    image: "${MEDIA_DL_IMAGE:-ghcr.io/ihezebin/media-dl}:${MEDIA_DL_TAG:?MEDIA_DL_TAG is required; use a GitHub repository tag such as v0.1.0}"
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${MEDIA_DL_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      MEDIA_DL_PROXY: ${MEDIA_DL_PROXY:-}
      MEDIA_DL_COOKIE: ${MEDIA_DL_COOKIE:-}
      MEDIA_DL_COOKIES: ${MEDIA_DL_COOKIES:-}
    volumes:
      - ./downloads:/app/downloads
