services:
  media-dl:
    image: media-dl:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MEDIA_DL_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      MEDIA_DL_PROXY: ${MEDIA_DL_PROXY:-}
      MEDIA_DL_COOKIE: ${MEDIA_DL_COOKIE:-}
      MEDIA_DL_COOKIES: ${MEDIA_DL_COOKIES:-}
    volumes:
      - ./downloads:/app/downloads
