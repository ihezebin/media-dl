root = "."
tmp_dir = ".package/dev"

[build]
cmd = "go build -o .package/dev/media-dl ."
bin = ".package/dev/media-dl"
args_bin = ["server", "--api-only=false"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".git", ".package", "bin", "downloads", "webui", "vendor"]
exclude_regex = ["_test.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true
